<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b57d0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Caixa d'água</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3105/3105807.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f4f9; color: #1e293b; padding-bottom: 75px; user-select: none; }
    
    header { background: linear-gradient(180deg, #0b57d0 0%, #1665d8 100%); color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .header-left { display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.2px; }
    .icon-btn { background: none; border: none; color: white; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
    .ble-active { color: #4ade80 !important; filter: drop-shadow(0 0 6px rgba(74,222,128,0.8)); }

    .container { padding: 14px; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .card { background: #ffffff; border-radius: 18px; padding: 18px; box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05); }

    .top-grid { display: grid; grid-template-columns: 1.25fr 1fr; align-items: center; }
    .level-col { border-right: 1px solid #e2e8f0; padding-right: 12px; }
    .label-muted { font-size: 16px; font-weight: 600; color: #475569; margin-bottom: 2px; }
    .big-pct { font-size: 52px; font-weight: 800; color: #0b2545; line-height: 1.05; letter-spacing: -1.5px; }
    .big-pct span { font-size: 30px; font-weight: 700; margin-left: 2px; }
    .sub-metrics { font-size: 15px; font-weight: 500; color: #334155; margin-top: 6px; }
    .progress-track { width: 100%; height: 11px; background: #e2e8f0; border-radius: 8px; margin-top: 12px; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #0b57d0, #2563eb); border-radius: 8px; width: 0%; transition: width 0.4s ease, background 0.4s ease; }

    .trend-col { text-align: center; padding-left: 12px; }
    .trend-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 19px; font-weight: 700; color: #16a34a; margin-bottom: 4px; }
    .trend-badge.down { color: #dc2626; }
    .trend-badge.flat { color: #64748b; }
    .trend-liters { font-size: 18px; font-weight: 800; color: #0f172a; }
    .trend-caption { font-size: 11.5px; color: #64748b; margin-top: 2px; }

    .card-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .card-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: #0f172a; }
    .pills { display: flex; gap: 4px; }
    .pill { border: 1px solid #cbd5e1; background: #f8fafc; color: #334155; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 20px; cursor: pointer; }
    .pill.active { background: #0b57d0; color: white; border-color: #0b57d0; }
    .consumption-val { font-size: 34px; font-weight: 800; color: #0b2545; line-height: 1.1; }
    .consumption-val span { font-size: 16px; font-weight: 500; color: #334155; }
    .consumption-period { font-size: 13px; color: #475569; margin: 4px 0 8px 0; }

    .chart-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .chart-hint { font-size: 11px; color: #64748b; }
    .zoom-btns { display: flex; gap: 4px; }
    .zoom-btn { border: 1px solid #cbd5e1; background: #f8fafc; color: #334155; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 8px; cursor: pointer; line-height: 1.3; }
    .zoom-btn:active { background: #e2e8f0; }
    .chart-box { position: relative; height: 210px; width: 100%; touch-action: none; }
    .chart-point-label { display: none; margin-top: 8px; padding: 7px 10px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; font-size: 12px; color: #1e3a8a; font-weight: 600; justify-content: space-between; align-items: center; gap: 8px; }
    .chart-point-label.visible { display: flex; }

    .freq-badge { font-size: 12px; color: #475569; font-weight: 500; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; text-align: center; }
    th { background: #f1f5f9; color: #334155; font-weight: 600; padding: 8px 4px; font-size: 11.5px; border-bottom: 1px solid #e2e8f0; }
    td { padding: 9px 4px; border-bottom: 1px solid #f1f5f9; color: #1e293b; font-weight: 500; }
    td:first-child { font-weight: 700; }
    .var-up { color: #16a34a; font-weight: 700; }
    .var-down { color: #dc2626; font-weight: 700; }
    .var-zero { color: #64748b; }

    /* Tabela de leituras com rolagem */
    .table-scroll { max-height: 360px; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-top: 8px; }
    .table-scroll table { margin-top: 0; }
    .table-scroll th { position: sticky; top: 0; z-index: 1; }

    #alertBanner { display: none; background: #fee2e2; border-left: 5px solid #dc2626; color: #991b1b; padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; align-items: center; justify-content: space-between; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: white; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #e2e8f0; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #64748b; font-size: 12px; font-weight: 600; cursor: pointer; background: none; border: none; width: 50%; height: 100%; justify-content: center; position: relative; }
    .nav-item.active { color: #0b57d0; }
    .nav-item.active::after { content: ""; position: absolute; bottom: 0; width: 65%; height: 3px; background: #0b57d0; border-radius: 3px 3px 0 0; }

    #settingsModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
    .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .modal-content input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
    .btn-save { background: #0b57d0; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="icon-btn" onclick="openSettings()" title="Menu">☰</button>
      <h1>Caixa d'água</h1>
    </div>
    <div style="display: flex; gap: 12px;">
      <button class="icon-btn" id="bleBtn" onclick="connectBLE()" title="Conectar Bluetooth Instantâneo">ᛒ</button>
      <button class="icon-btn" onclick="fetchSheetData()" title="Atualizar Nuvem">↻</button>
    </div>
  </header>

  <div class="container">
    <div id="alertBanner">
      <span id="alertText">⚠️ Alerta de Volume!</span>
      <button onclick="document.getElementById('alertBanner').style.display='none'" style="background:none;border:none;font-weight:bold;color:#991b1b;font-size:16px;cursor:pointer;">✕</button>
    </div>

    <div class="card">
      <div class="top-grid">
        <div class="level-col">
          <div class="label-muted">Nível Atual <small id="liveTag" style="display:none;color:#16a34a;font-size:11px;">● BLE</small></div>
          <div class="big-pct" id="lvlPct">--<span>%</span></div>
          <div class="sub-metrics" id="lvlSub">-- cm • -- L</div>
          <div class="progress-track">
            <div class="progress-bar" id="lvlBar"></div>
          </div>
        </div>
        <div class="trend-col">
          <div class="trend-badge flat" id="trendBadge">➖ <span id="trendStatus">--</span></div>
          <div class="trend-liters" id="trendDelta">--</div>
          <div class="trend-caption" id="trendCaption">(inclinação últimos 30 min)</div>
        </div>
      </div>
      <div id="bleInfo" style="font-size:11px;color:#64748b;margin-top:10px;"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">📊 Consumo no Período</div>
        <div class="pills">
          <button class="pill active" onclick="setPeriod(this, 'hoje')">Hoje</button>
          <button class="pill" onclick="setPeriod(this, '7d')">7 dias</button>
          <button class="pill" onclick="setPeriod(this, '30d')">30 dias</button>
        </div>
      </div>
      <div class="consumption-val" id="consTotal">-- L <span>consumidos</span></div>
      <div class="consumption-period" id="consRange">--</div>
      <div class="chart-toolbar">
        <span class="chart-hint">Toque para rótulos • Pinça/scroll para zoom</span>
        <div class="zoom-btns">
          <button class="zoom-btn" type="button" onclick="zoomChart(1.35)" title="Aproximar">+</button>
          <button class="zoom-btn" type="button" onclick="zoomChart(0.75)" title="Afastar">−</button>
          <button class="zoom-btn" type="button" onclick="resetChartZoom()" title="Resetar zoom">↺</button>
        </div>
      </div>
      <div class="chart-box">
        <canvas id="consumptionChart"></canvas>
      </div>
      <div class="chart-point-label" id="chartPointLabel">
        <span id="chartPointText"></span>
        <button type="button" onclick="clearChartSelection()" style="background:none;border:none;color:#1e3a8a;font-weight:700;cursor:pointer;font-size:13px;" title="Fechar">✕</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">🕒 Leituras Recentes</div>
        <span class="freq-badge" id="freqBadge"></span>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Horário</th>
              <th>Altura da água</th>
              <th>Volume</th>
              <th>Nível</th>
              <th>Variação</th>
            </tr>
          </thead>
          <tbody id="readingsBody"><tr><td colspan="5" style="color:#64748b">Aguardando dados…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="closeSettings()">
      <span style="font-size:20px;">🏠</span>
      <span>Início</span>
    </button>
    <button class="nav-item" onclick="openSettings()">
      <span style="font-size:20px;">⚙️</span>
      <span>Configurações</span>
    </button>
  </nav>

  <div id="settingsModal">
    <div class="modal-content">
      <h3>Configurações do Sistema</h3>
      <label style="font-size:12px;color:#475569;">URL do Google Apps Script (termina em /exec):</label>
      <input type="text" id="apiInput" placeholder="https://script.google.com/macros/s/.../exec">
      <label style="font-size:12px;color:#475569;">Token (igual ao TOKEN_ESPERADO do script):</label>
      <input type="password" id="tokenInput" autocomplete="off">
      <div id="statusMsg" style="font-size:12px;color:#64748b;min-height:16px;"></div>
      <button class="btn-save" onclick="saveSettings()">Salvar e Atualizar</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // ===== Helpers de armazenamento seguro =====
    function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

    // ===== Configuração (salva no aparelho) =====
    let API_URL = lsGet('api_url');
    let TOKEN   = lsGet('api_token');
    let triggeredAlerts = new Set();
    let chartInstance = null;
    let READINGS = [];          // [{t, cm, altura, litros, pct}] do mais antigo para o mais novo
    let LITROS_MAX = 918;       // sobrescrito pelo servidor
    let PERIOD = 'hoje';
    let bleLastTs = 0;          // última leitura BLE (para a nuvem não sobrescrever o "ao vivo")

    // Parâmetros de consolidação e filtro de ruído do sensor
    const JANELA_TENDENCIA_MS  = 30 * 60 * 1000; // inclinação consolidada nos últimos 30 min
    const INTERVALO_CONSUMO_MS = 10 * 60 * 1000; // consumo efetivo consolidado a cada 10 min
    const PRECISAO_CM          = 0.2;            // 2 mm = 0,2 cm de precisão do sensor

    // Mesma calibração do Apps Script (usada só para leituras BLE, que chegam em cm de distância)
    const DIST_VAZIA_CM = 96, ALTURA_MAX_CM = 71, LIMITE_ALTURA_CM = 76;
    const TABELA = [[0,0],[10,103],[20,214],[30,333],[40,461],[50,598],[60,745],[70,901],[71,918],[76,1000]];
    function litrosPorAltura(h) {
      if (h <= TABELA[0][0]) return TABELA[0][1];
      if (h >= TABELA[TABELA.length-1][0]) return TABELA[TABELA.length-1][1];
      for (let i = 1; i < TABELA.length; i++) {
        if (h <= TABELA[i][0]) {
          const a = TABELA[i-1], b = TABELA[i];
          return a[1] + (b[1]-a[1]) * (h-a[0]) / (b[0]-a[0]);
        }
      }
      return 0;
    }

    document.getElementById('apiInput').value = API_URL;
    document.getElementById('tokenInput').value = TOKEN;

    const fmt = (n, d = 1) => Number(n).toFixed(d).replace('.', ',');
    const pad = n => String(n).padStart(2, '0');
    const hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const ddmm = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
    const fmtDateTime = ts => {
      const d = new Date(ts);
      return `${ddmm(d)} ${hhmm(d)}`;
    };

    function setStatus(msg, isError) {
      const el = document.getElementById('statusMsg');
      el.style.color = isError ? '#dc2626' : '#64748b';
      el.innerText = msg;
      if (isError) {
        document.getElementById('alertText').innerText = '⚠️ ' + msg;
        document.getElementById('alertBanner').style.display = 'flex';
      }
    }

    // ===== Gráfico Interativo com Zoom, Escala Y Variante e Rótulos ao Clicar =====
    function calcDynamicYRange(points) {
      if (!points || points.length === 0) return { min: 0, max: 100 };
      let minV = Infinity, maxV = -Infinity;
      for (const p of points) {
        if (p.y < minV) minV = p.y;
        if (p.y > maxV) maxV = p.y;
      }
      const span = maxV - minV;
      const margin = Math.max(5, span * 0.2);
      let yMin = Math.floor((minV - margin) / 5) * 5;
      let yMax = Math.ceil((maxV + margin) / 5) * 5;
      // Garante janela visual confortável (ex.: 70% a 100% quando a caixa está em ~85%)
      if (yMax - yMin < 25) {
        const mid = (minV + maxV) / 2;
        yMin = Math.round((mid - 15) / 5) * 5;
        yMax = Math.round((mid + 15) / 5) * 5;
      }
      yMin = Math.max(0, yMin);
      yMax = Math.min(100, yMax);
      if (yMax - yMin < 10) {
        if (yMax >= 100) yMin = Math.max(0, 100 - 20);
        else if (yMin <= 0) yMax = Math.min(100, 20);
        else { yMin = Math.max(0, yMin - 5); yMax = Math.min(100, yMax + 5); }
      }
      return { min: yMin, max: yMax };
    }

    function showChartSelection(pt) {
      if (!pt) return;
      const box = document.getElementById('chartPointLabel');
      const txt = document.getElementById('chartPointText');
      txt.innerText = `${fmtDateTime(pt.x)} • ${fmt(pt.pct, 1)}% • ${Math.round(pt.litros)} L • ${fmt(pt.altura, 1)} cm`;
      box.classList.add('visible');
    }

    function clearChartSelection() {
      const box = document.getElementById('chartPointLabel');
      box.classList.remove('visible');
      if (chartInstance && chartInstance.tooltip) {
        chartInstance.tooltip.setActiveElements([], { x: 0, y: 0 });
        chartInstance.setActiveElements([]);
        chartInstance.update('none');
      }
    }

    function zoomChart(factor) {
      if (chartInstance && typeof chartInstance.zoom === 'function') {
        chartInstance.zoom(factor);
      }
    }

    function resetChartZoom() {
      if (chartInstance && typeof chartInstance.resetZoom === 'function') {
        chartInstance.resetZoom();
      }
    }

    function initChart(points = [], xMin = null, xMax = null, period = PERIOD) {
      clearChartSelection();
      const canvas = document.getElementById('consumptionChart');
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, 200);
      gradient.addColorStop(0, 'rgba(11, 87, 208, 0.30)');
      gradient.addColorStop(1, 'rgba(11, 87, 208, 0.02)');
      if (chartInstance) chartInstance.destroy();

      if (typeof Chart === 'undefined') return;
      if (window.ChartZoom && Chart.registry && !Chart.registry.plugins.get('zoom')) {
        try { Chart.register(window.ChartZoom); } catch (e) {}
      }

      const yRange = calcDynamicYRange(points);
      const now = Date.now();
      const minX = xMin !== null ? xMin : now - 3600e3;
      const maxX = xMax !== null && xMax > minX ? xMax : minX + 3600e3;

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [{
            label: 'Nível',
            data: points,
            parsing: false,
            borderColor: '#0b57d0',
            borderWidth: 2.2,
            pointRadius: points.length > 60 ? 1.5 : 3,
            pointHoverRadius: 6,
            pointHitRadius: 18,
            pointBackgroundColor: '#0b57d0',
            pointHoverBackgroundColor: '#ffffff',
            pointHoverBorderColor: '#0b57d0',
            pointHoverBorderWidth: 2.5,
            fill: true,
            backgroundColor: gradient,
            tension: 0.25
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 220 },
          interaction: {
            mode: 'nearest',
            axis: 'x',
            intersect: false
          },
          onClick: (evt, _elements, chart) => {
            const hits = chart.getElementsAtEventForMode(evt, 'nearest', { axis: 'x', intersect: false }, true);
            if (!hits || hits.length === 0) return;
            const { datasetIndex, index } = hits[0];
            const pt = chart.data.datasets[datasetIndex].data[index];
            if (!pt) return;
            chart.setActiveElements([{ datasetIndex, index }]);
            chart.tooltip.setActiveElements([{ datasetIndex, index }], { x: evt.x, y: evt.y });
            chart.update('none');
            showChartSelection(pt);
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              enabled: true,
              backgroundColor: 'rgba(15, 23, 42, 0.92)',
              titleColor: '#f8fafc',
              bodyColor: '#e2e8f0',
              padding: 10,
              cornerRadius: 10,
              displayColors: false,
              callbacks: {
                title: items => items.length ? fmtDateTime(items[0].raw.x) : '',
                label: item => {
                  const p = item.raw;
                  return [
                    `Nível: ${fmt(p.pct, 1)}%`,
                    `Volume: ${Math.round(p.litros)} L`,
                    `Altura: ${fmt(p.altura, 1)} cm`
                  ];
                }
              }
            },
            zoom: {
              limits: {
                x: { min: minX, max: maxX, minRange: 10 * 60 * 1000 },
                y: { min: 0, max: 100, minRange: 5 }
              },
              pan: {
                enabled: true,
                mode: 'x'
              },
              zoom: {
                wheel: { enabled: true },
                pinch: { enabled: true },
                mode: 'x'
              }
            }
          },
          scales: {
            y: {
              min: yRange.min,
              max: yRange.max,
              ticks: {
                maxTicksLimit: 6,
                callback: v => Math.round(v) + '%'
              },
              grid: { color: '#f1f5f9' }
            },
            x: {
              type: 'linear',
              min: minX,
              max: maxX,
              grid: { color: '#f1f5f9' },
              ticks: {
                maxTicksLimit: 6,
                maxRotation: 0,
                autoSkip: true,
                callback: (val, _idx, _ticks) => {
                  const d = new Date(val);
                  if (period === 'hoje') return hhmm(d);
                  const scale = chartInstance && chartInstance.scales ? chartInstance.scales.x : null;
                  const visSpan = scale ? (scale.max - scale.min) : (maxX - minX);
                  return visSpan <= 36 * 3600e3 ? `${ddmm(d)} ${hhmm(d)}` : ddmm(d);
                }
              }
            }
          }
        }
      });
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    function checkVolumeAlerts(pct) {
      const bar = document.getElementById('lvlBar');
      if (pct <= 30) bar.style.background = '#dc2626';
      else if (pct <= 50) bar.style.background = '#f59e0b';
      else bar.style.background = 'linear-gradient(90deg, #0b57d0, #2563eb)';
      [70, 50, 30].forEach(limit => {
        if (pct <= limit && !triggeredAlerts.has(limit)) {
          triggeredAlerts.add(limit);
          const msg = `⚠️ Atenção: Volume atingiu ${fmt(pct)}% (Limite de ${limit}%)`;
          document.getElementById('alertText').innerText = msg;
          document.getElementById('alertBanner').style.display = 'flex';
          playBeep();
          if ("Notification" in window && Notification.permission === "granted") {
            new Notification("Alerta da Caixa d'Água", { body: msg });
          }
        } else if (pct > limit + 3) {
          triggeredAlerts.delete(limit);
        }
      });
    }

    // altura = altura da água (cm); litros; pct
    function updateDisplay(altura, litros, pct) {
      document.getElementById('lvlPct').innerHTML = `${fmt(pct, 0)}<span>%</span>`;
      document.getElementById('lvlSub').innerText = `${fmt(altura)} cm • ${Math.round(litros)} L`;
      document.getElementById('lvlBar').style.width = `${Math.min(100, Math.max(0, pct))}%`;
      checkVolumeAlerts(pct);
    }

    // ===== Nuvem (Google Sheets via Apps Script) =====
    function parseTs(v) {
      if (typeof v === 'number' && !isNaN(v)) {
        return v < 1e11 ? v * 1000 : v; // converte segundos para ms se necessário
      }
      if (typeof v === 'string') {
        const s = v.trim();
        if (/^\d+(\.\d+)?$/.test(s)) {
          const n = Number(s);
          return n < 1e11 ? n * 1000 : n;
        }
        // Formato brasileiro DD/MM/YYYY HH:mm(:ss)
        const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:[\s,T]+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
        if (m) {
          let yr = parseInt(m[3], 10);
          if (yr < 100) yr += 2000;
          return new Date(yr, parseInt(m[2], 10) - 1, parseInt(m[1], 10), parseInt(m[4] || 0, 10), parseInt(m[5] || 0, 10), parseInt(m[6] || 0, 10)).getTime();
        }
        const p = Date.parse(s);
        if (!isNaN(p)) return p;
      }
      return NaN;
    }

    async function fetchSheetData() {
      if (!API_URL || !TOKEN) { setStatus('Configure a URL e o token em ☰ / Configurações.', false); return; }
      let data;
      try {
        const url = new URL(API_URL);
        url.searchParams.set('acao', 'dados');
        url.searchParams.set('n', '50000');
        url.searchParams.set('token', TOKEN);
        const res = await fetch(url.toString(), { cache: 'no-store', redirect: 'follow' });
        const txt = await res.text();
        try { data = JSON.parse(txt); }
        catch (e) {
          if (/token/i.test(txt)) throw new Error('Token incorreto.');
          if (/<html/i.test(txt)) throw new Error('O script não está publicado para "Qualquer pessoa" ou a URL está errada.');
          throw new Error('Resposta inesperada: ' + txt.slice(0, 80));
        }
      } catch (err) {
        setStatus(err.message || String(err), true);
        console.log('Erro na leitura da planilha:', err);
        return;
      }
      setStatus('Atualizado às ' + hhmm(new Date()), false);
      LITROS_MAX = data.litrosMax || LITROS_MAX;
      READINGS = (data.leituras || []).map(r => ({
        ...r,
        t: parseTs(r.t ?? r.timestamp ?? r.data),
        altura: Number(String(r.altura ?? 0).replace(',', '.')),
        litros: Number(String(r.litros ?? 0).replace(',', '.')),
        pct: Number(String(r.pct ?? 0).replace(',', '.'))
      })).filter(r => !isNaN(r.t) && !isNaN(r.litros)).sort((a, b) => a.t - b.t);
      render();
    }

    // ===== Tendência Consolidada (Inclinação da curva nos últimos 30 min) =====
    function calcTendencia30min(readings) {
      if (!readings || readings.length < 2) return null;
      const last = readings[readings.length - 1];
      const cutoff = last.t - JANELA_TENDENCIA_MS;
      let win = readings.filter(r => r.t >= cutoff);

      // Se houver menos de 2 pontos dentro de 30 min, usa também o ponto imediatamente anterior (até 60 min)
      if (win.length < 2) {
        const prev = readings[readings.length - 2];
        if (last.t - prev.t <= 60 * 60 * 1000) win = [prev, last];
        else return { status: 'flat', deltaL: 0, deltaCm: 0 };
      }

      const t0 = win[0].t;
      const xs = win.map(r => (r.t - t0) / 60000);
      const dtMin = xs[xs.length - 1] - xs[0];
      if (dtMin <= 0) return { status: 'flat', deltaL: 0, deltaCm: 0 };

      const n = win.length;
      const meanX = xs.reduce((s, x) => s + x, 0) / n;
      const meanH = win.reduce((s, r) => s + r.altura, 0) / n;
      const meanL = win.reduce((s, r) => s + r.litros, 0) / n;

      let numH = 0, numL = 0, den = 0;
      for (let i = 0; i < n; i++) {
        const dx = xs[i] - meanX;
        numH += dx * (win[i].altura - meanH);
        numL += dx * (win[i].litros - meanL);
        den += dx * dx;
      }
      if (den === 0) return { status: 'flat', deltaL: 0, deltaCm: 0 };

      const slopeH = numH / den; // cm/min
      const slopeL = numL / den; // L/min
      const deltaCm = slopeH * dtMin;
      const deltaL = slopeL * dtMin;

      let status = 'flat';
      if (deltaCm >= PRECISAO_CM) status = 'up';
      else if (deltaCm <= -PRECISAO_CM) status = 'down';

      return { status, deltaL, deltaCm };
    }

    function render() {
      if (READINGS.length === 0) {
        document.getElementById('readingsBody').innerHTML = '<tr><td colspan="5" style="color:#64748b">Nenhuma leitura na planilha ainda.</td></tr>';
        return;
      }
      const last = READINGS[READINGS.length - 1];
      if (Date.now() - bleLastTs > 15000) updateDisplay(last.altura, last.litros, last.pct);

      // Tendência consolidada (inclinação dos últimos 30 min)
      const badge = document.getElementById('trendBadge');
      const trend = calcTendencia30min(READINGS);
      if (trend) {
        if (trend.status === 'up') {
          badge.className = 'trend-badge';
          badge.innerHTML = '📈 <span>Subindo</span>';
          document.getElementById('trendDelta').innerText = `+${fmt(Math.abs(trend.deltaL), 0)} L`;
        } else if (trend.status === 'down') {
          badge.className = 'trend-badge down';
          badge.innerHTML = '📉 <span>Descendo</span>';
          document.getElementById('trendDelta').innerText = `−${fmt(Math.abs(trend.deltaL), 0)} L`;
        } else {
          badge.className = 'trend-badge flat';
          badge.innerHTML = '➖ <span>Estável</span>';
          document.getElementById('trendDelta').innerText = '0 L';
        }
      }

      // Frequência estimada
      if (READINGS.length >= 2) {
        const dt = (last.t - READINGS[READINGS.length - 2].t) / 60000;
        document.getElementById('freqBadge').innerText = dt < 90 ? `A cada ~${Math.round(dt)} min` : `A cada ~${fmt(dt / 60)} h`;
      }

      // Leituras recentes (mais nova primeiro), até 10000, com rolagem
      const MAX_LINHAS = 10000;
      const linhas = [];
      for (let i = READINGS.length - 1; i >= Math.max(0, READINGS.length - MAX_LINHAS); i--) {
        const r = READINGS[i], prev = READINGS[i - 1];
        const d = new Date(r.t);
        const diff = prev ? r.litros - prev.litros : 0;
        let varHtml = '<td class="var-zero">— 0 L</td>';
        if (diff > 0) varHtml = `<td class="var-up">▲ +${fmt(diff, 0)} L</td>`;
        if (diff < 0) varHtml = `<td class="var-down">▼ ${fmt(Math.abs(diff), 0)} L</td>`;
        linhas.push(`<tr><td>${ddmm(d)} ${hhmm(d)}</td><td>${fmt(r.altura)} cm</td><td>${Math.round(r.litros)} L</td><td>${fmt(r.pct, 0)}%</td>${varHtml}</tr>`);
      }
      document.getElementById('readingsBody').innerHTML = linhas.join('');
      renderPeriod();
    }

    function periodStart() {
      const now = new Date();
      if (PERIOD === 'hoje') return new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0).getTime();
      if (PERIOD === '7d')   return now.getTime() - 7 * 86400e3;
      return now.getTime() - 30 * 86400e3;
    }

    function mediana(arr) {
      const s = arr.slice().sort((a, b) => a - b);
      const m = Math.floor(s.length / 2);
      return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
    }

    // Consumo efetivo: consolida leituras em blocos de 10 min (mediana) e soma apenas
    // quedas >= 2 mm (0,2 cm). Oscilações milimétricas menores são filtradas como precisão do sensor.
    function calcConsumo(rows) {
      if (!rows || rows.length < 2) return 0;

      const buckets = new Map();
      for (const r of rows) {
        const key = Math.floor(r.t / INTERVALO_CONSUMO_MS);
        if (!buckets.has(key)) buckets.set(key, { alturas: [], litros: [] });
        const b = buckets.get(key);
        b.alturas.push(r.altura);
        b.litros.push(r.litros);
      }

      const keys = Array.from(buckets.keys()).sort((a, b) => a - b);
      const serie = keys.map(k => {
        const b = buckets.get(k);
        return {
          t: k * INTERVALO_CONSUMO_MS,
          altura: mediana(b.alturas),
          litros: mediana(b.litros)
        };
      });

      if (serie.length < 2) return 0;

      let refAltura = serie[0].altura;
      let refLitros = serie[0].litros;
      let consumo = 0;

      for (let i = 1; i < serie.length; i++) {
        const cur = serie[i];
        const dh = cur.altura - refAltura;
        if (Math.abs(dh) < PRECISAO_CM) continue; // ruído < 2 mm: mantém a âncora
        if (dh <= -PRECISAO_CM) {
          const dL = refLitros - cur.litros;
          if (dL > 0) consumo += dL;
        }
        refAltura = cur.altura;
        refLitros = cur.litros;
      }
      return consumo;
    }

    // Redução preservando picos e vales (min/max por faixa) para manter fidelidade em 7 e 30 dias
    function downsampleMinMax(rows, maxPts = 240) {
      if (rows.length <= maxPts) return rows;
      const numBuckets = Math.floor(maxPts / 2);
      const step = rows.length / numBuckets;
      const out = [];
      for (let b = 0; b < numBuckets; b++) {
        const start = Math.floor(b * step);
        const end = Math.min(rows.length, Math.floor((b + 1) * step));
        if (start >= end) continue;
        let minR = rows[start], maxR = rows[start];
        for (let i = start + 1; i < end; i++) {
          if (rows[i].pct < minR.pct) minR = rows[i];
          if (rows[i].pct > maxR.pct) maxR = rows[i];
        }
        if (minR === maxR) out.push(minR);
        else if (minR.t <= maxR.t) { out.push(minR); out.push(maxR); }
        else { out.push(maxR); out.push(minR); }
      }
      const last = rows[rows.length - 1];
      if (out[out.length - 1] !== last) out.push(last);
      return out;
    }

    function renderPeriod() {
      const t0 = periodStart();
      const now = Date.now();
      const LABEL = { hoje: 'Hoje', '7d': '7 dias', '30d': '30 dias' }[PERIOD];
      const idx = READINGS.findIndex(r => r.t >= t0);
      const rows = idx < 0 ? [] : READINGS.slice(idx);

      // Para 'hoje', filtra estritamente as leituras de hoje (00:00 em diante).
      // Para '7d' e '30d', se houver leitura anterior à janela, interpola o nível exato em t0.
      let base = rows;
      if (PERIOD !== 'hoje' && idx > 0 && rows.length > 0) {
        const prev = READINGS[idx - 1], first = rows[0];
        const dt = first.t - prev.t;
        const frac = dt > 0 ? Math.max(0, Math.min(1, (t0 - prev.t) / dt)) : 1;
        const litrosT0 = prev.litros + (first.litros - prev.litros) * frac;
        const alturaT0 = prev.altura + (first.altura - prev.altura) * frac;
        const pctT0 = prev.pct + (first.pct - prev.pct) * frac;
        base = [{ ...prev, t: t0, litros: litrosT0, altura: alturaT0, pct: pctT0 }, ...rows];
      }

      if (rows.length === 0) {
        document.getElementById('consTotal').innerHTML = '0 L <span>consumidos</span>';
        document.getElementById('consRange').innerText = `${LABEL} • sem leituras no período`;
        initChart([], t0, now, PERIOD);
        return;
      }

      const consumo = calcConsumo(base);
      document.getElementById('consTotal').innerHTML = `${Math.round(consumo)} L <span>consumidos</span>`;
      const a = new Date(rows[0].t), b = new Date(rows[rows.length - 1].t);
      const rangeStr = PERIOD === 'hoje'
        ? `${hhmm(a)} – ${hhmm(b)}`
        : `${ddmm(a)} ${hhmm(a)} – ${ddmm(b)} ${hhmm(b)}`;
      let faixa = `${LABEL} • ${rangeStr}`;
      if (PERIOD !== 'hoje' && READINGS[0].t > t0 + 3600e3) {
        faixa += ` • dados desde ${ddmm(new Date(READINGS[0].t))}`;
      }
      document.getElementById('consRange').innerText = faixa;

      const sampled = downsampleMinMax(rows, 240);
      const points = sampled.map(r => ({
        x: r.t,
        y: Math.round(r.pct * 10) / 10,
        pct: r.pct,
        litros: r.litros,
        altura: r.altura
      }));
      const xMax = Math.max(now, rows[rows.length - 1].t);
      initChart(points, t0, xMax, PERIOD);
    }

    function setPeriod(btn, p) {
      document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
      PERIOD = p;
      renderPeriod();
    }

    // ===== Bluetooth (leitura ao vivo) =====
    // Premissa: o firmware envia a DISTÂNCIA sensor→água em cm (texto, ex.: "25.3"), via BLE (GATT).
    let bleDevice = null, blePoll = null, bleTimer = null, bleRetries = 0;
    const bleInfo = msg => { document.getElementById('bleInfo').innerText = msg; };

    function processarBLE(dv) {
      let dist = NaN, bruto;
      if (dv.byteLength === 1) { dist = dv.getUint8(0); bruto = String(dist); }
      else {
        bruto = new TextDecoder().decode(dv).trim();
        const m = bruto.replace(',', '.').match(/\d+(\.\d+)?/);
        if (m) dist = parseFloat(m[0]);
      }
      if (isNaN(dist)) {
        const hex = Array.from(new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength)).map(x => x.toString(16).padStart(2, '0')).join(' ');
        bleInfo('BLE: formato não reconhecido (bytes: ' + hex + ')');
        return;
      }
      if (dist < 20 || dist > 110) {          // mesma faixa válida do firmware/planilha
        bleInfo(`BLE: valor ${fmt(dist)} fora da faixa 20–110 cm (recebido: "${bruto}")`);
        return;
      }
      const altura = Math.max(0, Math.min(LIMITE_ALTURA_CM, DIST_VAZIA_CM - dist));
      const litros = litrosPorAltura(altura);
      const pct = Math.min(100, Math.max(0, (litros / litrosPorAltura(ALTURA_MAX_CM)) * 100));
      bleLastTs = Date.now();
      updateDisplay(altura, litros, pct);
      bleInfo(`BLE ao vivo: distância ${fmt(dist)} cm • ${hhmm(new Date())}`);
    }

    async function iniciarBLE(device) {
      const server = await device.gatt.connect();
      const services = await server.getPrimaryServices();
      const lerPorPolling = [];
      let achou = 0;
      for (const service of services) {
        const chars = await service.getCharacteristics();
        for (const c of chars) {
          if (c.properties.notify || c.properties.indicate) {
            await c.startNotifications();
            c.addEventListener('characteristicvaluechanged', e => processarBLE(e.target.value));
            achou++;
          } else if (c.properties.read) {
            lerPorPolling.push(c);
            achou++;
          }
        }
      }
      if (!achou) throw new Error('nenhuma característica de leitura/notificação encontrada nos serviços permitidos');
      clearInterval(blePoll);
      if (lerPorPolling.length) {
        const ler = async () => { for (const c of lerPorPolling) { try { processarBLE(await c.readValue()); } catch (e) {} } };
        await ler();
        blePoll = setInterval(ler, 2000);
      }
      document.getElementById('bleBtn').classList.add('ble-active');
      document.getElementById('liveTag').style.display = 'inline';
      bleRetries = 0;
    }

    function aoDesconectarBLE() {
      clearInterval(blePoll); blePoll = null;
      document.getElementById('bleBtn').classList.remove('ble-active');
      document.getElementById('liveTag').style.display = 'none';
      bleLastTs = 0;
      if (!bleDevice || bleTimer) return;
      if (bleRetries >= 5) { bleInfo('BLE desconectado. Toque em ᛒ para conectar de novo.'); return; }
      bleRetries++;
      bleInfo(`BLE desconectado. Reconectando (${bleRetries}/5)…`);
      bleTimer = setTimeout(async () => {
        bleTimer = null;
        try { await iniciarBLE(bleDevice); } catch (e) { aoDesconectarBLE(); }
      }, 3000);
    }

    async function connectBLE() {
      if (!navigator.bluetooth) {
        setStatus('Abra este aplicativo no Android com Chrome atualizado para usar o Bluetooth BLE.', true);
        return;
      }
      try {
        const SERVICOS = [
          '4fafc201-1fb5-459e-8fcc-c5c9c331914b',
          '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
          '0000ffe0-0000-1000-8000-00805f9b34fb',
          '0000181a-0000-1000-8000-00805f9b34fb'
        ];
        // requestDevice PRIMEIRO: exige gesto recente do usuário (um prompt antes dele pode invalidar o gesto)
        const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: SERVICOS });
        if (bleDevice) bleDevice.removeEventListener('gattserverdisconnected', aoDesconectarBLE);
        bleDevice = device; bleRetries = 0;
        device.addEventListener('gattserverdisconnected', aoDesconectarBLE);
        if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
        bleInfo('BLE: conectando…');
        await iniciarBLE(device);
      } catch (err) {
        bleInfo('BLE: falha — ' + err.message);
        setStatus('Conexão BLE não concluída: ' + err.message, true);
      }
    }

    // ===== Configurações =====
    function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
    function saveSettings() {
      API_URL = document.getElementById('apiInput').value.trim();
      TOKEN = document.getElementById('tokenInput').value.trim();
      lsSet('api_url', API_URL);
      lsSet('api_token', TOKEN);
      closeSettings();
      fetchSheetData();
    }

    window.onload = () => {
      initChart();
      if (!API_URL || !TOKEN) openSettings();
      fetchSheetData();
      setInterval(fetchSheetData, 60000);
    };
  </script>
